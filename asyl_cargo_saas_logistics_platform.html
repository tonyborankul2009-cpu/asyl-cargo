    // --- MAIN APP COMPONENT ---
    function App() {
      // Local state replicating database persistence
      const [shipments, setShipments] = useState(() => {
        const saved = localStorage.getItem('asyl_shipments');
        return saved ? JSON.parse(saved) : INITIAL_SHIPMENTS;
      });

      const [pickupPoints, setPickupPoints] = useState(() => {
        const saved = localStorage.getItem('asyl_pickup');
        return saved ? JSON.parse(saved) : INITIAL_PICKUP_POINTS;
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('asyl_customers');
        return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
      });

      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem('asyl_messages');
        return saved ? JSON.parse(saved) : [
          { id: 'm1', name: 'Бауржан', phone: '+7 702 111 22 33', tracking: 'AC-20481', message: 'Уточните примерную дату прибытия в Алматы.', date: '2026-09-22 11:20', isRead: false }
        ];
      });

      const [activityLog, setActivityLog] = useState(() => {
        const saved = localStorage.getItem('asyl_logs');
        return saved ? JSON.parse(saved) : [
          { id: 'l1', admin: 'Система', action: 'Демо-база инициализирована', shipment: 'SYSTEM', date: '2026-09-22 08:00' }
        ];
      });

      // View Routing
      const [view, setView] = useState('client'); // 'client', 'admin-login', 'admin-dashboard'
      const [adminTab, setAdminTab] = useState('dashboard'); // 'dashboard', 'shipments', 'customers', 'pickup', 'messages', 'logs', 'settings'
      const [isAuthenticated, setIsAuthenticated] = useState(false);

      // Search & Selected Shipment for Track Widget
      const [searchTracking, setSearchTracking] = useState('');
      const [trackedResult, setTrackedResult] = useState(null);
      const [trackError, setTrackError] = useState('');

      // Toast Notification System
      const [toast, setToast] = useState(null);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Save to LocalStorage on State Change
      useEffect(() => {
        localStorage.setItem('asyl_shipments', JSON.stringify(shipments));
      }, [shipments]);

      useEffect(() => {
        localStorage.setItem('asyl_pickup', JSON.stringify(pickupPoints));
      }, [pickupPoints]);

      useEffect(() => {
        localStorage.setItem('asyl_messages', JSON.stringify(messages));
      }, [messages]);

      useEffect(() => {
        localStorage.setItem('asyl_logs', JSON.stringify(activityLog));
      }, [activityLog]);

      // Public Tracking Handler
      const handleTrackSearch = (e, targetCode) => {
        if(e) e.preventDefault();
        const code = (targetCode || searchTracking).trim().toUpperCase();
        if (!code) return;

        const found = shipments.find(s => s.tracking.toUpperCase() === code);
        if (found) {
          setTrackedResult(found);
          setTrackError('');
        } else {
          setTrackedResult(null);
          setTrackError('Груз с таким трек-номером не найден в базе.');
        }
      };

      // Status Badge Color Helper
      const getStatusStyle = (status) => {
        switch(status) {
          case 'В пути':
            return 'bg-champagneMuted/10 text-champagneBright border-champagneMuted/40';
          case 'Готов к выдаче':
            return 'bg-status-ready/10 text-status-ready border-status-ready/40';
          case 'Выдан':
            return 'bg-status-delivered/10 text-status-delivered border-status-delivered/40';
          case 'Задержан':
            return 'bg-status-delayed/10 text-status-delayed border-status-delayed/40';
          case 'Проблема':
            return 'bg-status-problem/10 text-status-problem border-status-problem/40';
          default:
            return 'bg-white/5 text-softWhite border-white/10';
        }
      };

      // Helper to add activity log
      const logAction = (adminName, actionText, shipmentCode) => {
        const newLog = {
          id: 'log_' + Date.now(),
          admin: adminName || 'Admin',
          action: actionText,
          shipment: shipmentCode || 'N/A',
          date: new Date().toISOString().replace('T', ' ').substring(0, 16)
        };
        setActivityLog(prev => [newLog, ...prev]);
      };

      return (
        <div className="relative min-h-screen flex flex-col">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-24 right-6 z-50 bg-darkGraphite border border-champagneMuted/60 text-softWhite px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">

                  <a href="#pickup" className="hover:text-champagneBright transition">Пункты выдачи</a>

              pickupPoints={pickupPoints}
              trackedResult={trackedResult}
              trackError={trackError}
              searchTracking={searchTracking}
              setSearchTracking={setSearchTracking}
              handleTrackSearch={handleTrackSearch}
              getStatusStyle={getStatusStyle}
              setMessages={setMessages}
              showNotification={showNotification}

                setIsAuthenticated(true);
                setView('admin-dashboard');
                showNotification('Успешная авторизация в Admin Panel');

              shipments={shipments}
              setShipments={setShipments}
              pickupPoints={pickupPoints}
              setPickupPoints={setPickupPoints}
              customers={customers}
              setCustomers={setCustomers}
              messages={messages}
              setMessages={setMessages}
              activityLog={activityLog}
              logAction={logAction}
              getStatusStyle={getStatusStyle}
              adminTab={adminTab}
              setAdminTab={setAdminTab}
              showNotification={showNotification}
              onLogout={() => {
                setIsAuthenticated(false);
                setView('client');
                showNotification('Вы вышли из системы');

                <p className="text-xs text-softWhite/40 mt-2">+7 707 666 93 59 • +7 707 260 71 72</p>
              </div>

              <div className="flex items-center gap-6">
                {/* DISCREET ADMIN LINK */}
                <button 
                  onClick={() => {
                    if (isAuthenticated) {
                      setView('admin-dashboard');
                    } else {
                      setView('admin-login');

      showNotification

      const [contactForm, setContactForm] = useState({ name: '', phone: '', tracking: '', message: '' });

      const handleContactSubmit = (e) => {
        e.preventDefault();
        if (!contactForm.name || !contactForm.phone || !contactForm.message) return;

        const newMsg = {
          id: 'msg_' + Date.now(),
          name: contactForm.name,
          phone: contactForm.phone,
          tracking: contactForm.tracking || 'Не указан',
          message: contactForm.message,
          date: new Date().toISOString().replace('T', ' ').substring(0, 16),
          isRead: false
        };

        setMessages(prev => [newMsg, ...prev]);
        setContactForm({ name: '', phone: '', tracking: '', message: '' });
        showNotification('Запрос отправлен. Менеджер свяжется с вами.');
      };

            {/* Background Glow */}

            <div className="lg:col-span-7 space-y-8 z-10">

                <span className="w-1.5 h-1.5 rounded-full bg-champagneMuted animate-pulse"></span>
                SaaS Logistics Platform • Almaty Cargo
              </div>

                Ваш груз.<br />
                <span className="gold-gradient-text">Под нашим контролем.</span>
              </h1>

              <p className="text-lg text-softWhite/70 max-w-xl font-normal leading-relaxed">
                Отслеживайте отправления и получайте актуальную информацию о доставке в Алматы в режиме реального времени.
              </p>

              <div className="flex flex-wrap items-center gap-4 pt-2">
                <a 
                  href="#tracking" 
                  className="bg-champagneMuted hover:bg-champagneBright text-deepBlack font-semibold px-8 py-4 rounded-xl transition duration-200 shadow-xl shadow-champagneMuted/15 flex items-center gap-2"
                >
                  Отследить груз →
                </a>
                <a 
                  href="#how-it-works" 
                  className="border border-white/10 hover:border-white/20 bg-darkGraphite/50 text-softWhite px-7 py-4 rounded-xl font-medium transition"

                  Как это работает

              </div>
            </div>

              <div className="relative glass-card rounded-2xl p-6 shadow-2xl border border-white/10 bg-gradient-to-b from-darkGraphite to-richGraphite">
                
                {/* Header */}
                <div className="flex items-center justify-between border-b border-white/5 pb-4 mb-6">

                    <span className="text-xs font-mono text-softWhite/60">LIVE SHIPMENT DATA</span>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-champagneMuted/10 text-champagneBright border border-champagneMuted/30">
                    SaaS Active

                </div>

                {/* Floating Tracking Card Demo */}

                    <div>
                      <span className="text-[10px] text-softWhite/40 block">TRACKING NUMBER</span>
                      <span className="text-base font-bold font-mono text-champagneBright">AC-20481</span>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] text-softWhite/40 block">STATUS</span>
                      <span className="text-xs px-2 py-0.5 rounded border bg-champagneMuted/10 text-champagneBright border-champagneMuted/30">

                  </div>

                  <div className="bg-deepBlack/40 border border-white/5 p-4 rounded-xl space-y-3">
                    <div className="flex justify-between text-xs text-softWhite/70">
                      <span>Маршрут: Гуанчжоу → Алматы</span>
                      <span className="font-mono text-champagneBright">68%</span>

                    {/* Progress Bar */}

                      <span className="w-2 h-2 rounded-full bg-champagneMuted"></span>
                      Текущая локация: Транзитный хаб Хоргос
                    </div>
                  </div>
                </div>

              </div>
            </div>

          </section>

          {/* TRACKING SYSTEM SECTION */}

    // ==========================================
    // ADMIN DASHBOARD MAIN CONTAINER
    // ==========================================
    function AdminDashboard({ 
      shipments, 
      setShipments, 
      pickupPoints, 
      setPickupPoints, 
      customers, 
      setCustomers, 
      messages, 
      setMessages, 
      activityLog, 
      logAction,
      getStatusStyle, 
      adminTab, 
      setAdminTab,
      showNotification,
      onLogout
    }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');
      const [selectedShipment, setSelectedShipment] = useState(null);
      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);

      // KPI Calculations
      const stats = useMemo(() => {
        return {
          total: shipments.length,
          transit: shipments.filter(s => s.status === 'В пути').length,
          ready: shipments.filter(s => s.status === 'Готов к выдаче').length,
          delivered: shipments.filter(s => s.status === 'Выдан').length,
          problems: shipments.filter(s => ['Задержан', 'Проблема'].includes(s.status)).length
        };
      }, [shipments]);

      // Filtered Shipments
      const filteredShipments = useMemo(() => {
        return shipments.filter(s => {
          const matchesSearch = 
            s.tracking.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.customer.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.phone.includes(searchQuery) ||
            s.destination.toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesStatus = filterStatus === 'All' || s.status === filterStatus;

          return matchesSearch && matchesStatus;
        });
      }, [shipments, searchQuery, filterStatus]);

      // Update Shipment Status Handler
      const handleStatusUpdate = (shipmentId, newStatus, newLocation) => {
        setShipments(prev => prev.map(s => {
          if (s.id === shipmentId) {
            const timeNow = new Date().toISOString().replace('T', ' ').substring(0, 16);
            const updatedHistory = [
              ...s.history,
              { status: newStatus, location: newLocation || s.location, time: timeNow }
            ];
            return {
              ...s,
              status: newStatus,
              location: newLocation || s.location,
              updatedAt: timeNow,
              history: updatedHistory
            };
          }
          return s;
        }));

        const sObj = shipments.find(s => s.id === shipmentId);
        logAction('Admin', `Смена статуса: ${newStatus}`, sObj?.tracking);
        showNotification(`Статус заказа ${sObj?.tracking} обновлен`);
      };

      // Create Shipment Handler
      const handleCreateShipment = (formData) => {
        const timeNow = new Date().toISOString().replace('T', ' ').substring(0, 16);
        const newShipment = {
          id: 's_' + Date.now(),
          tracking: formData.tracking.toUpperCase(),
          customer: formData.customerName,
          phone: formData.customerPhone,
          origin: formData.origin || 'Гуанчжоу, Китай',
          destination: formData.destination || 'Алматы, Казахстан',
          status: formData.status || 'Заказ принят',
          location: formData.location || 'Склад отправления',
          weight: formData.weight ? formData.weight + ' кг' : '1.0 кг',
          packages: Number(formData.packages) || 1,
          description: formData.description || 'Общий груз',
          pickupPoint: formData.pickupPoint || pickupPoints[0]?.name,
          updatedAt: timeNow,
          history: [
            { status: formData.status || 'Заказ принят', location: formData.location || 'Склад отправления', time: timeNow }
          ]
        };

        setShipments(prev => [newShipment, ...prev]);
        logAction('Admin', 'Создан новый заказ', newShipment.tracking);
        setIsCreateModalOpen(false);
        showNotification(`Заказ ${newShipment.tracking} успешно создан`);
      };

      return (
        <div className="flex-1 flex flex-col md:flex-row bg-deepBlack">
          
          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-[#0A0A0A] border-r border-white/5 p-6 flex flex-col gap-6">
            <div className="text-xs font-semibold uppercase tracking-widest text-champagneMuted">
              Admin Panel
            </div>

            <nav className="space-y-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'shipments', label: 'Shipments', icon: '📦' },
                { id: 'customers', label: 'Customers', icon: '👥' },
                { id: 'pickup', label: 'Pickup Points', icon: '📍' },
                { id: 'messages', label: 'Messages', icon: '💬', badge: messages.filter(m => !m.isRead).length },
                { id: 'logs', label: 'Activity Log', icon: '📜' },
                { id: 'settings', label: 'Settings', icon: '⚙️' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => {
                    setAdminTab(tab.id);
                    setSelectedShipment(null);
                  }}
                  className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-xs font-medium transition ${adminTab === tab.id ? 'bg-champagneMuted/15 text-champagneBright border border-champagneMuted/30' : 'text-softWhite/60 hover:text-softWhite hover:bg-white/[0.02]'}`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </div>
                  {tab.badge > 0 && (
                    <span className="bg-champagneMuted text-deepBlack text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                      {tab.badge}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            <div className="mt-auto pt-6 border-t border-white/5">
              <button 
                onClick={onLogout}
                className="w-full flex items-center gap-2 text-xs text-status-problem hover:underline px-2 py-1"
              >
                <span>🚪</span> Sign out
              </button>
            </div>
          </aside>

          {/* MAIN ADMIN CONTENT */}
          <main className="flex-1 p-6 md:p-8 space-y-8 overflow-y-auto">
            
            {/* TAB: DASHBOARD / OVERVIEW */}
            {adminTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl font-bold text-softWhite">Logistics Dashboard</h1>
                    <p className="text-xs text-softWhite/50">Обзор всех заказов и текущей активности</p>
                  </div>
                  <button 
                    onClick={() => setIsCreateModalOpen(true)}
                    className="bg-champagneMuted hover:bg-champagneBright text-deepBlack text-xs font-bold px-5 py-3 rounded-xl transition flex items-center gap-2"
                  >
                    + Create Shipment
                  </button>
                </div>

                {/* KPI CARDS */}
                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                  {[
                    { label: 'Total Shipments', val: stats.total, color: 'text-softWhite' },
                    { label: 'In Transit', val: stats.transit, color: 'text-champagneBright' },
                    { label: 'Ready for Pickup', val: stats.ready, color: 'text-status-ready' },
                    { label: 'Delivered', val: stats.delivered, color: 'text-status-delivered' },
                    { label: 'Problems', val: stats.problems, color: 'text-status-problem' }
                  ].map((k, i) => (
                    <div key={i} className="bg-richGraphite border border-white/5 p-5 rounded-2xl space-y-1">
                      <span className="text-[11px] text-softWhite/40 block">{k.label}</span>
                      <span className={`text-2xl font-bold font-mono ${k.color}`}>{k.val}</span>
                    </div>
                  ))}
                </div>

                {/* RECENT SHIPMENTS TABLE PREVIEW */}
                <div className="bg-richGraphite rounded-2xl border border-white/5 p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-base font-bold text-softWhite">Последние отправления</h3>
                    <button onClick={() => setAdminTab('shipments')} className="text-xs text-champagneBright hover:underline">
                      Все заказы →
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="text-softWhite/40 uppercase font-mono border-b border-white/5">
                        <tr>
                          <th className="pb-3">Tracking</th>
                          <th className="pb-3">Customer</th>
                          <th className="pb-3">Status</th>
                          <th className="pb-3">Updated</th>
                          <th className="pb-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {shipments.slice(0, 5).map(s => (
                          <tr key={s.id} className="hover:bg-white/[0.01]">
                            <td className="py-3 font-mono font-bold text-champagneBright">{s.tracking}</td>
                            <td className="py-3 text-softWhite">{s.customer}</td>
                            <td className="py-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] border ${getStatusStyle(s.status)}`}>
                                {s.status}
                              </span>
                            </td>
                            <td className="py-3 font-mono text-softWhite/40">{s.updatedAt}</td>
                            <td className="py-3 text-right">
                              <button 
                                onClick={() => {
                                  setSelectedShipment(s);
                                  setAdminTab('shipments');
                                }} 
                                className="text-xs text-champagneBright hover:underline"
                              >
                                Edit / View
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* TAB: SHIPMENTS MANAGEMENT */}
            {adminTab === 'shipments' && (
              <div className="space-y-6">
                
                {/* Header Actions */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl font-bold text-softWhite">Управление заказами</h1>
                    <p className="text-xs text-softWhite/50">Просмотр и изминение статусов отправлений</p>
                  </div>
                  <button 
                    onClick={() => setIsCreateModalOpen(true)}
                    className="bg-champagneMuted hover:bg-champagneBright text-deepBlack text-xs font-bold px-5 py-3 rounded-xl transition"
                  >
                    + Create Shipment
                  </button>
                </div>

                {/* SEARCH & FILTERS BAR */}
                <div className="flex flex-col sm:flex-row gap-3">
                  <input 
                    type="text" 
                    placeholder="Поиск по треку, клиенту, телефону..." 
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="flex-1 bg-richGraphite border border-white/10 rounded-xl px-4 py-2.5 text-xs text-softWhite placeholder-softWhite/30 outline-none focus:border-champagneMuted"
                  />

                  <select 
                    value={filterStatus}
                    onChange={e => setFilterStatus(e.target.value)}
                    className="bg-richGraphite border border-white/10 rounded-xl px-4 py-2.5 text-xs text-softWhite outline-none focus:border-champagneMuted"
                  >
                    <option value="All">Все статусы</option>
                    {STATUSES.map(st => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>

                {/* DETAILED SHIPMENT EDIT MODAL / DRAWER */}
                {selectedShipment && (
                  <div className="bg-richGraphite border border-champagneMuted/40 p-6 rounded-2xl space-y-6 animate-fadeIn">
                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                      <div>
                        <span className="text-xs font-mono text-champagneBright font-bold block">{selectedShipment.tracking}</span>
                        <h3 className="text-lg font-bold text-softWhite">Редактирование заказа</h3>
                      </div>
                      <button onClick={() => setSelectedShipment(null)} className="text-xs text-softWhite/40 hover:text-softWhite">
                        Закрыть ✕
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      
                      {/* STATUS CHANGER FORM */}
                      <div className="md:col-span-2 space-y-4 bg-deepBlack/50 p-5 rounded-xl border border-white/5">
                        <h4 className="text-xs font-bold uppercase tracking-wider text-champagneMuted">Изменение статуса (Change Status)</h4>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-[11px] text-softWhite/50 mb-1">Новый статус</label>
                            <select 
                              id="modalStatusSelect"
                              defaultValue={selectedShipment.status}
                              className="w-full bg-darkGraphite border border-white/10 rounded-lg p-2.5 text-xs text-softWhite outline-none focus:border-champagneMuted"
                            >
                              {STATUSES.map(st => (
                                <option key={st} value={st}>{st}</option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-[11px] text-softWhite/50 mb-1">Текущая локация</label>
                            <input 
                              id="modalLocationInput"
                              type="text" 
                              defaultValue={selectedShipment.location}
                              className="w-full bg-darkGraphite border border-white/10 rounded-lg p-2.5 text-xs text-softWhite outline-none focus:border-champagneMuted"
                            />
                          </div>
                        </div>

                        <button 
                          onClick={() => {
                            const newSt = document.getElementById('modalStatusSelect').value;
                            const newLoc = document.getElementById('modalLocationInput').value;
                            handleStatusUpdate(selectedShipment.id, newSt, newLoc);
                            setSelectedShipment(prev => ({ ...prev, status: newSt, location: newLoc }));
                          }}
                          className="bg-champagneMuted hover:bg-champagneBright text-deepBlack font-bold text-xs px-6 py-2.5 rounded-lg transition"
                        >
                          Update Status →
                        </button>
                      </div>

                      {/* SHIPMENT SUMMARY */}
                      <div className="space-y-3 text-xs bg-darkGraphite/50 p-5 rounded-xl">
                        <div><span className="text-softWhite/40">Клиент:</span> <span className="text-softWhite font-medium block">{selectedShipment.customer}</span></div>
                        <div><span className="text-softWhite/40">Телефон:</span> <span className="text-softWhite font-mono block">{selectedShipment.phone}</span></div>
                        <div><span className="text-softWhite/40">Пункт выдачи:</span> <span className="text-champagneBright block">{selectedShipment.pickupPoint}</span></div>
                        <div><span className="text-softWhite/40">Описание:</span> <span className="text-softWhite block">{selectedShipment.description}</span></div>
                      </div>

                    </div>
                  </div>
                )}

                {/* MAIN TABLE */}
                <div className="bg-richGraphite rounded-2xl border border-white/5 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-darkGraphite/80 text-softWhite/40 uppercase font-mono p-4">
                        <tr>
                          <th className="p-4">Tracking</th>
                          <th className="p-4">Customer</th>
                          <th className="p-4">Destination</th>
                          <th className="p-4">Status</th>
                          <th className="p-4">Updated</th>
                          <th className="p-4 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {filteredShipments.map(s => (
                          <tr key={s.id} className="hover:bg-white/[0.01]">
                            <td className="p-4 font-mono font-bold text-champagneBright">{s.tracking}</td>
                            <td className="p-4">
                              <span className="text-softWhite block font-medium">{s.customer}</span>
                              <span className="text-[10px] text-softWhite/40">{s.phone}</span>
                            </td>
                            <td className="p-4 text-softWhite/70">{s.destination}</td>
                            <td className="p-4">
                              <span className={`px-2.5 py-1 rounded text-[10px] border ${getStatusStyle(s.status)}`}>
                                {s.status}
                              </span>
                            </td>
                            <td className="p-4 font-mono text-softWhite/40">{s.updatedAt}</td>
                            <td className="p-4 text-right">
                              <button 
                                onClick={() => setSelectedShipment(s)}
                                className="text-xs text-champagneBright hover:underline"
                              >
                                Edit / View
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* TAB: CUSTOMERS */}
            {adminTab === 'customers' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-softWhite">База клиентов</h1>

                <div className="bg-richGraphite rounded-2xl border border-white/5 p-6">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="text-softWhite/40 uppercase font-mono border-b border-white/5">
                        <tr>
                          <th className="pb-3">Имя клиента</th>
                          <th className="pb-3">Телефон</th>
                          <th className="pb-3">Всего посылок</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {customers.map(c => {
                          const count = shipments.filter(s => s.phone === c.phone).length;
                          return (
                            <tr key={c.id}>
                              <td className="py-3 text-softWhite font-medium">{c.name}</td>
                              <td className="py-3 font-mono text-champagneBright">{c.phone}</td>
                              <td className="py-3 font-mono text-softWhite/60">{count}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: PICKUP POINTS MANAGEMENT */}
            {adminTab === 'pickup' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-softWhite">Пункты выдачи (Pickup Points)</h1>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {pickupPoints.map(p => (
                    <div key={p.id} className="bg-richGraphite p-6 rounded-2xl border border-white/5 space-y-3">
                      <h3 className="text-lg font-bold text-softWhite">{p.name}</h3>
                      <p className="text-xs text-softWhite/60">{p.address}</p>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 inline-block">
                        {p.status}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: MESSAGES */}
            {adminTab === 'messages' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-softWhite">Сообщения клиентов</h1>

                <div className="space-y-4">
                  {messages.map(m => (
                    <div key={m.id} className="bg-richGraphite p-6 rounded-2xl border border-white/5 space-y-2">
                      <div className="flex justify-between text-xs text-softWhite/50">
                        <span className="font-bold text-softWhite">{m.name} ({m.phone})</span>
                        <span className="font-mono">{m.date}</span>
                      </div>
                      <p className="text-xs text-champagneBright">Трек: {m.tracking}</p>
                      <p className="text-sm text-softWhite/80">{m.message}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: ACTIVITY LOG */}
            {adminTab === 'logs' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-softWhite">Лог действий (Activity Log)</h1>

                <div className="bg-richGraphite rounded-2xl border border-white/5 p-6">
                  <div className="space-y-3">
                    {activityLog.map(l => (
                      <div key={l.id} className="flex items-center justify-between text-xs border-b border-white/5 pb-2">
                        <div className="flex items-center gap-3">
                          <span className="text-champagneBright font-medium">{l.admin}</span>
                          <span className="text-softWhite">{l.action}</span>
                          <span className="font-mono text-softWhite/40">[{l.shipment}]</span>
                        </div>
                        <time className="font-mono text-softWhite/30">{l.date}</time>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: SETTINGS */}
            {adminTab === 'settings' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-softWhite">Настройки системы</h1>

                <div className="bg-richGraphite p-6 rounded-2xl border border-white/5 space-y-4 max-w-xl">
                  <div>
                    <label className="block text-xs text-softWhite/50 mb-1">Название компании</label>
                    <input type="text" defaultValue="ASYL CARGO" className="w-full bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                  </div>
                  <div>
                    <label className="block text-xs text-softWhite/50 mb-1">Слоган</label>
                    <input type="text" defaultValue="Ваш груз. Под нашим контролем." className="w-full bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                  </div>
                  <button onClick={() => showNotification('Настройки сохранены')} className="bg-champagneMuted text-deepBlack font-bold text-xs px-6 py-2.5 rounded-xl">
                    Сохранить
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* CREATE SHIPMENT MODAL */}
          {isCreateModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-richGraphite border border-white/10 rounded-3xl p-8 max-w-xl w-full space-y-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/10 pb-4">
                  <h3 className="text-xl font-bold text-softWhite">+ Создать новое отправление</h3>
                  <button onClick={() => setIsCreateModalOpen(false)} className="text-softWhite/40 hover:text-softWhite">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleCreateShipment({
                    tracking: form.tracking.value,
                    customerName: form.customerName.value,
                    customerPhone: form.customerPhone.value,
                    origin: form.origin.value,
                    destination: form.destination.value,
                    weight: form.weight.value,
                    packages: form.packages.value,
                    description: form.description.value,
                    pickupPoint: form.pickupPoint.value,
                    status: 'Заказ принят',
                    location: 'Склад отправителя'
                  });
                }} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <input name="tracking" placeholder="Трек-номер (например AC-90901) *" required className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                    <input name="customerName" placeholder="ФИО клиента *" required className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <input name="customerPhone" placeholder="Телефон клиента *" required className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                    <select name="pickupPoint" className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite">
                      {pickupPoints.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <input name="origin" defaultValue="Гуанчжоу, Китай" placeholder="Откуда" className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                    <input name="destination" defaultValue="Алматы, Казахстан" placeholder="Куда" className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <input name="weight" placeholder="Вес (кг)" className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                    <input name="packages" type="number" defaultValue="1" placeholder="Мест" className="bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite" />
                  </div>

                  <textarea name="description" placeholder="Описание груза" rows="2" className="w-full bg-deepBlack border border-white/10 rounded-xl p-3 text-xs text-softWhite"></textarea>

                  <button type="submit" className="w-full bg-champagneMuted hover:bg-champagneBright text-deepBlack font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider">
                    Создать отправление
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
